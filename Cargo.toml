[workspace]
resolver = "3"
members = [
    "crates/geom",
    "crates/color",
    "crates/core",
    "crates/demux",
    "crates/audio-dsp",
    "crates/muxers",
    "crates/image-codecs",
    "crates/video-codecs",
    "crates/spatial-io",
    "crates/platform",
    "crates/pipeline",
    "crates/presets",
    "crates/watch",
    "crates/ipc",
    "crates/engine",
    "crates/ui-egui",
    "crates/mcp",
    "crates/dispatch",
    "apps/encodercraft",
    "apps/encodercraft-cli",
    "xtask",
]
default-members = [
    "crates/geom",
    "crates/color",
    "crates/core",
    "crates/demux",
    "crates/audio-dsp",
    "crates/muxers",
    "crates/image-codecs",
    "crates/video-codecs",
    "crates/spatial-io",
    "crates/platform",
    "crates/pipeline",
    "crates/presets",
    "crates/watch",
    "crates/ipc",
    "crates/engine",
    "crates/ui-egui",
    "crates/mcp",
    "crates/dispatch",
    "apps/encodercraft",
    "apps/encodercraft-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/el-j/encodercraft"
authors = ["el-j", "ArtCraft Contributors"]

[workspace.dependencies]
# Upstream shared ArtCraft libraries (official storytold/craft-libs repository)
craft-media = { git = "https://github.com/storytold/craft-libs", default-features = false, features = ["isobmff", "matroska", "bitstream"] }

# Official ArtCraft repositories (mapped to canonical `craft-*` crate names; transitions to craft-libs once #504 & #439-#448 merge)
craft-h264enc = { package = "filmcraft-h264enc", git = "https://github.com/storytold/filmcraft" }
craft-prores = { package = "filmcraft-prores", git = "https://github.com/storytold/filmcraft" }
craft-dnx = { package = "filmcraft-dnx", git = "https://github.com/storytold/filmcraft" }
craft-vp8 = { package = "filmcraft-vp8", git = "https://github.com/storytold/filmcraft" }
craft-hevcenc = { package = "effectcraft-hevcenc", git = "https://github.com/storytold/effectcraft" }
craft-av1enc = { package = "effectcraft-av1enc", git = "https://github.com/storytold/effectcraft" }
craft-vp9enc = { package = "effectcraft-vp9enc", git = "https://github.com/storytold/effectcraft" }
filmcraft-captions = { git = "https://github.com/storytold/filmcraft" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft" }
filmcraft-mxf = { git = "https://github.com/storytold/filmcraft" }
craft-aac = { package = "filmcraft-aac", git = "https://github.com/storytold/filmcraft" }
craft-opus = { package = "filmcraft-opus", git = "https://github.com/storytold/filmcraft" }
craft-audio-io = { package = "soundcraft-audio-io", git = "https://github.com/storytold/soundcraft" }

# Internal workspace crates (encodercraft-*)
encodercraft-core = { path = "crates/core" }
encodercraft-geom = { path = "crates/geom" }
encodercraft-color = { path = "crates/color" }
encodercraft-demux = { path = "crates/demux" }
encodercraft-video-codecs = { path = "crates/video-codecs" }
encodercraft-audio-dsp = { path = "crates/audio-dsp" }
encodercraft-image-codecs = { path = "crates/image-codecs" }
encodercraft-spatial-io = { path = "crates/spatial-io" }
encodercraft-muxers = { path = "crates/muxers" }
encodercraft-platform = { path = "crates/platform" }
encodercraft-pipeline = { path = "crates/pipeline" }
encodercraft-presets = { path = "crates/presets" }
encodercraft-watch = { path = "crates/watch" }
encodercraft-ipc = { path = "crates/ipc" }
encodercraft-engine = { path = "crates/engine" }
encodercraft-ui-egui = { path = "crates/ui-egui" }
encodercraft-mcp = { path = "crates/mcp" }
encodercraft-dispatch = { path = "crates/dispatch" }
craft-dispatch = { path = "crates/dispatch" }

# Foundations & utilities
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rayon = "1"
crossbeam-channel = "0.5"
notify = "8"
kurbo = { version = "0.13", features = ["serde"] }
bytemuck = "1"
miniz_oxide = "0.8"
log = "0.4"
env_logger = "0.11"
proptest = "1"
tempfile = "3"
egui = "0.37"
eframe = { version = "0.37", default-features = false }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

