[workspace]
resolver = "3"
members = [
    "crates/geom",
    "crates/color",
    "crates/core",
    "crates/demux",
    "crates/shared-stream",
    "crates/audio-dsp",
    "crates/muxers",
    "crates/image-codecs",
    "crates/video-codecs",
    "crates/source",
    "crates/spatial-io",
    "crates/platform",
    "crates/pipeline",
    "crates/presets",
    "crates/watch",
    "crates/ipc",
    "crates/engine",
    "crates/ui-egui",
    "crates/mcp",
    "crates/dispatch",
    "apps/encodercraft",
    "apps/encodercraft-cli",
    "xtask",
]
default-members = [
    "crates/geom",
    "crates/color",
    "crates/core",
    "crates/demux",
    "crates/shared-stream",
    "crates/audio-dsp",
    "crates/muxers",
    "crates/image-codecs",
    "crates/video-codecs",
    "crates/source",
    "crates/spatial-io",
    "crates/platform",
    "crates/pipeline",
    "crates/presets",
    "crates/watch",
    "crates/ipc",
    "crates/engine",
    "crates/ui-egui",
    "crates/mcp",
    "crates/dispatch",
    "apps/encodercraft",
    "apps/encodercraft-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/el-j/encodercraft"
authors = ["el-j", "ArtCraft Contributors"]

[workspace.dependencies]
# Upstream shared ArtCraft libraries (official storytold/craft-libs repository)
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", default-features = false, features = ["isobmff", "matroska", "bitstream", "avi", "mxf", "mpegts", "ogg"] }
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-window = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", features = ["ui"] }
craft-menu = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-keymap = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", features = ["egui"] }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", features = ["stl", "obj", "ply", "gltf", "fbx", "dae", "abc"] }
craft-docx = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-usd = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-svg = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-markdown = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-html = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-idml = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-epub = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-eps = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", default-features = false, features = ["decode", "peaks", "encode", "flac-decode", "flac-encode", "pcm-encode", "ac3-encode", "eac3-encode", "alac-encode", "alac-decode", "aac-encode", "mp3-encode", "opus-encode", "vorbis-encode", "qoa"] }
craft-audio-dsp = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-image-codecs = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", default-features = false, features = ["h264", "hevc", "prores", "dnx", "av1", "vp9", "vp8", "apv", "mpeg2", "mpeg4", "ffv1", "hap"] }
craft-captions = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-cms = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-gainmap = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-timeline = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", features = ["xml", "otio"] }
craft-aaf = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-time = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-docpath = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-behavior = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248" }
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", features = ["ui"] }

# Official ArtCraft repositories remaining prior to upstream consolidation
filmcraft-scopes = { git = "https://github.com/storytold/filmcraft", rev = "2d1d1b6920cf14c166e1b2bc73ba8208def150c9" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "2d1d1b6920cf14c166e1b2bc73ba8208def150c9" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "2d1d1b6920cf14c166e1b2bc73ba8208def150c9" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "2d1d1b6920cf14c166e1b2bc73ba8208def150c9" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "2d1d1b6920cf14c166e1b2bc73ba8208def150c9" }

# Internal workspace crates (encodercraft-*)
encodercraft-core = { path = "crates/core" }
encodercraft-shared-stream = { path = "crates/shared-stream" }
encodercraft-geom = { path = "crates/geom" }
encodercraft-color = { path = "crates/color" }
encodercraft-demux = { path = "crates/demux" }
encodercraft-video-codecs = { path = "crates/video-codecs" }
encodercraft-audio-dsp = { path = "crates/audio-dsp" }
encodercraft-image-codecs = { path = "crates/image-codecs" }
encodercraft-spatial-io = { path = "crates/spatial-io" }
encodercraft-muxers = { path = "crates/muxers" }
encodercraft-platform = { path = "crates/platform" }
encodercraft-pipeline = { path = "crates/pipeline" }
encodercraft-source = { path = "crates/source" }
encodercraft-presets = { path = "crates/presets" }
encodercraft-watch = { path = "crates/watch" }
encodercraft-ipc = { path = "crates/ipc" }
encodercraft-engine = { path = "crates/engine" }
encodercraft-ui-egui = { path = "crates/ui-egui" }
encodercraft-mcp = { path = "crates/mcp" }
encodercraft-dispatch = { path = "crates/dispatch" }
craft-dispatch = { path = "crates/dispatch" }

# Foundations & utilities
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
hayro = "0.9"
lopdf = "0.47"
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rayon = "1"
crossbeam-channel = "0.5"
iceoryx2 = { version = "0.10", default-features = false, features = ["std"] }
notify = "9"
kurbo = { version = "0.13", features = ["serde"] }
bytemuck = "1"
miniz_oxide = "0.9"
log = "0.4"
env_logger = "0.11"
proptest = "1"
tempfile = "3"
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"

[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
emath = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

# Codec hot loops: keep craft-video fast even in debug/test builds.
[profile.dev.package.craft-video]
opt-level = 3
