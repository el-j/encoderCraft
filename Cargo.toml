[workspace]
resolver = "3"
members = [
    "crates/geom",
    "crates/color",
    "crates/core",
    "crates/demux",
    "crates/audio-dsp",
    "crates/muxers",
    "crates/image-codecs",
    "crates/video-codecs",
    "crates/spatial-io",
    "crates/pipeline",
    "crates/presets",
    "crates/watch",
    "crates/ipc",
    "crates/engine",
    "crates/ui-egui",
    "crates/mcp",
    "crates/dispatch",
    "apps/encodercraft",
    "apps/encodercraft-cli",
    "xtask",
]
default-members = [
    "crates/geom",
    "crates/color",
    "crates/core",
    "crates/demux",
    "crates/audio-dsp",
    "crates/muxers",
    "crates/image-codecs",
    "crates/video-codecs",
    "crates/spatial-io",
    "crates/pipeline",
    "crates/presets",
    "crates/watch",
    "crates/ipc",
    "crates/engine",
    "crates/ui-egui",
    "crates/mcp",
    "crates/dispatch",
    "apps/encodercraft",
    "apps/encodercraft-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/el-j/encodercraft"
authors = ["el-j", "ArtCraft Contributors"]

[workspace.dependencies]
# Upstream shared ArtCraft libraries (craft-libs)
craft-media = { path = "../craft-libs/crates/media", default-features = false, features = ["isobmff", "matroska", "bitstream"] }
craft-cms = { path = "../craft-libs/crates/cms" }
craft-jpeg = { path = "../craft-libs/crates/jpeg" }
craft-crw = { path = "../craft-libs/crates/crw" }
craft-i18n = { path = "../craft-libs/crates/i18n" }
craft-keymap = { path = "../craft-libs/crates/keymap", features = ["egui", "ui"] }
craft-update = { path = "../craft-libs/crates/update", features = ["egui"] }

# Sibling Craft app codecs (path dependencies)
filmcraft-bitstream = { path = "../filmcraft/crates/bitstream" }
filmcraft-h264enc = { path = "../filmcraft/crates/h264enc" }
filmcraft-prores = { path = "../filmcraft/crates/prores" }
filmcraft-aac = { path = "../filmcraft/crates/aac" }
effectcraft-hevcenc = { path = "../effectcraft/crates/hevcenc" }
effectcraft-av1enc = { path = "../effectcraft/crates/av1enc" }
effectcraft-vp9enc = { path = "../effectcraft/crates/vp9enc" }
soundcraft-audio-io = { path = "../soundcraft/crates/audio-io" }

# Internal workspace crates (encodercraft-*)
encodercraft-core = { path = "crates/core" }
encodercraft-geom = { path = "crates/geom" }
encodercraft-color = { path = "crates/color" }
encodercraft-demux = { path = "crates/demux" }
encodercraft-video-codecs = { path = "crates/video-codecs" }
encodercraft-audio-dsp = { path = "crates/audio-dsp" }
encodercraft-image-codecs = { path = "crates/image-codecs" }
encodercraft-spatial-io = { path = "crates/spatial-io" }
encodercraft-muxers = { path = "crates/muxers" }
encodercraft-platform = { path = "crates/platform" }
encodercraft-pipeline = { path = "crates/pipeline" }
encodercraft-presets = { path = "crates/presets" }
encodercraft-watch = { path = "crates/watch" }
encodercraft-ipc = { path = "crates/ipc" }
encodercraft-engine = { path = "crates/engine" }
encodercraft-ui-egui = { path = "crates/ui-egui" }
encodercraft-mcp = { path = "crates/mcp" }
encodercraft-dispatch = { path = "crates/dispatch" }
craft-dispatch = { path = "crates/dispatch" }

# Foundations & utilities
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rayon = "1"
crossbeam-channel = "0.5"
notify = "8"
kurbo = { version = "0.13", features = ["serde"] }
bytemuck = "1"
miniz_oxide = "0.8"
log = "0.4"
env_logger = "0.11"
proptest = "1"
tempfile = "3"
egui = "0.37"
eframe = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch."https://github.com/storytold/craft-libs"]
craft-media = { path = "../craft-libs/crates/media" }
craft-docpath = { path = "../craft-libs/crates/docpath" }
craft-ui = { path = "../craft-libs/crates/ui" }

