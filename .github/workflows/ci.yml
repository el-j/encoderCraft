name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`: fmt, clippy -D
# warnings, tests, layer check), through the suite's shared gate workflow in craft-common-actions.
# `cargo xtask` is the alias defined in .cargo/config.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-24.04", "windows-latest"]'
      timeout-minutes: 90
      # Use the suite-pinned font assets without adding them as a Cargo dependency or committing binaries.
      craft-fonts-ref: aced4137c022f1f587624d48e81ec77e1914a9cc
      require-craft-fonts: true
      tools: ""
      targets: ""
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev

  media-qa:
    name: Real-media QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg tools (Linux)
        if: runner.os == 'Linux'
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install --yes ffmpeg)
      - name: Install FFmpeg tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
      - name: Verify independent media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run real-media CLI and queue QA
        env:
          ENCODERCRAFT_REQUIRE_FULL_QA: "1"
        run: cargo test -p encodercraft-cli --test qa_matrix -- --nocapture
