name: nightly-robustness

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malformed-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Malformed-media corpus and property tests (extended cases)
        env:
          PROPTEST_CASES: "5000"
        run: cargo test -p encodercraft-source -p encodercraft-pipeline -p encodercraft-engine --release
