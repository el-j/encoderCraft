# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: encodercraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: video
priority: optional
maintainer: ${ENCODERCRAFT_MAINTAINER}
vendor: Learning Machines LLC
homepage: https://getartcraft.com/apps/encodercraft
license: MIT OR Apache-2.0
description: |-
  Open-source, native media transcoding and batch queue application.
  Encodes video, audio and image sequences with presets, watch folders and
  a headless queue daemon. Includes encodercraft-cli, a headless encoder,
  queue client and MCP server.

# The app links glibc and libgcc_s. Windowing (X11/Wayland, xkbcommon) and the GPU (Vulkan,
# EGL/GL) are loaded at runtime, so they are dependencies/recommendations here rather than ELF
# NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/encodercraft
    dst: /usr/bin/encodercraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/encodercraft-cli
    dst: /usr/bin/encodercraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
