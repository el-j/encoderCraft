# Flatpak manifest for EncoderCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.storyteller.encodercraft.yml
#   flatpak run ai.storyteller.encodercraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# ai.storyteller.encodercraft.bundle.yml repackages the release tarball into the .flatpak attached
# to each GitHub release; keep runtime-version, finish-args identical in both
# (packaging-lint checks this).
#
id: ai.storyteller.encodercraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: encodercraft
finish-args:
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Update checks reach GitHub (Help > Check for Updates and the startup check).
  - --share=network
  # GPU access for the wgpu UI (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd) and drag-and-drop the document portal,
  # so broad filesystem access isn't needed. Videos is granted for media opened by path from the
  # command line and for watch folders there.
  - --filesystem=xdg-videos
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: encodercraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/encodercraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p encodercraft -p encodercraft-cli
      - install -Dm755 target/release/encodercraft /app/bin/encodercraft
      - install -Dm644 NOTICE /app/share/doc/encodercraft/NOTICE
      - install -Dm755 target/release/encodercraft-cli /app/bin/encodercraft-cli
      - install -Dm644 packaging/linux/ai.storyteller.encodercraft.desktop /app/share/applications/ai.storyteller.encodercraft.desktop
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.encodercraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.encodercraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - plan
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
